<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- An upgrade link is private and single-use. Keeping it out of search results costs one line
         and stops a shared screenshot from becoming an indexed page. -->
    <meta name="robots" content="noindex, nofollow" />
    <!-- No Referer at all: the session id is in the query string, and a referrer header would hand
         it to every third party this page ever loads from. -->
    <meta name="referrer" content="no-referrer" />
    <title>Upgrade — Ada</title>
    <link rel="icon" href="assets/img/icon.png" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="bar">
      <a class="brand" href="index.html">
        <img src="assets/img/mark.svg" alt="" width="22" height="22" />
        <span>Ada</span>
      </a>
      <nav>
        <a href="index.html#product">Product</a>
        <a href="pricing.html">Pricing</a>
        <button id="theme" class="tgl" type="button" title="Switch theme" aria-label="Switch theme">
          <svg class="sun" width="14" height="14" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="9" cy="9" r="3.4" />
            <path d="M9 1.5v2M9 14.5v2M1.5 9h2M14.5 9h2M3.7 3.7l1.4 1.4M12.9 12.9l1.4 1.4M14.3 3.7l-1.4 1.4M5.1 12.9l-1.4 1.4" stroke-linecap="round" />
          </svg>
          <svg class="moon" width="14" height="14" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M15 10.8A6.5 6.5 0 0 1 7.2 3a6.5 6.5 0 1 0 7.8 7.8z" stroke-linejoin="round" />
          </svg>
        </button>
      </nav>
    </header>

    <style>
      /* Page-scoped styles: the upgrade flow is a focused instrument panel — one decision,
         clearly lit. Everything keys off the site's Nocturne tokens so both themes work. */
      .up-wrap { max-width: 880px; margin: 0 auto; padding: 0 var(--pad) 96px; }
      .up-toggle { display: flex; justify-content: center; margin: 0 0 28px; }
      .up-toggle .pill { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--panel); }
      .up-toggle button { font: 500 12px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); background: none; border: 0; border-radius: 999px; padding: 8px 18px; cursor: pointer; }
      .up-toggle button.on { color: var(--ink); background: var(--panel-2); box-shadow: inset 0 0 0 1px var(--line); }
      .up-toggle .save { color: var(--ada); margin-left: 6px; }
      .up-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 18px; align-items: stretch; }
      .up-card { position: relative; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 26px 24px 22px; }
      .up-card.hot { border-color: var(--ada); box-shadow: 0 0 0 1px var(--ada), 0 18px 48px -24px rgba(145, 132, 217, 0.45); }
      .up-badge { position: absolute; top: -11px; left: 22px; font: 500 10.5px var(--mono); letter-spacing: 0.1em; text-transform: uppercase; background: var(--ada); color: var(--void); border-radius: 999px; padding: 4px 10px; }
      .up-badge.mute { background: var(--panel-2); color: var(--dim); border: 1px solid var(--line); }
      .up-name { font: 600 17px var(--sans); color: var(--ink); margin: 0 0 14px; }
      .up-price { display: flex; align-items: baseline; gap: 8px; margin: 0 0 4px; }
      .up-price b { font: 600 clamp(34px, 4.5vw, 42px)/1 var(--sans); color: var(--ink); letter-spacing: -0.02em; }
      .up-price span { font: 400 12px var(--mono); color: var(--dim); }
      .up-cycle { font: 400 12px var(--mono); color: var(--dim); min-height: 18px; margin: 0 0 18px; }
      .up-feats { list-style: none; margin: 0 0 22px; padding: 18px 0 0; border-top: 1px solid var(--line); flex: 1; }
      .up-feats li { display: flex; gap: 10px; align-items: baseline; font: 400 13.5px/1.5 var(--sans); color: var(--ink-2); padding: 5px 0; }
      .up-feats li::before { content: '+'; font: 500 13px var(--mono); color: var(--ada); }
      .up-cta { display: block; width: 100%; text-align: center; font: 500 13.5px var(--sans); border-radius: 9px; padding: 12px 16px; cursor: pointer; transition: filter 0.15s, background 0.15s; }
      .up-cta.primary { background: var(--ada); color: var(--void); border: 1px solid var(--ada); }
      .up-cta.primary:hover { filter: brightness(1.12); }
      .up-cta.ghost { background: none; color: var(--ink-2); border: 1px solid var(--line); }
      .up-cta.ghost:hover { border-color: var(--dim); color: var(--ink); }
      .up-cta[disabled] { opacity: 0.45; cursor: default; }
      .up-trust { display: flex; justify-content: center; gap: 26px; flex-wrap: wrap; margin: 30px 0 0; font: 400 11.5px var(--mono); letter-spacing: 0.04em; color: var(--dim); }
      .up-trust span::before { content: '✓ '; color: var(--ada); }
      .up-note { text-align: center; margin: 18px 0 0; }
      .up-state { text-align: center; padding: 34px 0 10px; }
      .up-spin { width: 34px; height: 34px; margin: 0 auto 18px; border: 2px solid var(--line); border-top-color: var(--ada); border-radius: 50%; animation: upspin 0.9s linear infinite; }
      .up-check { width: 54px; height: 54px; margin: 0 auto 18px; border-radius: 50%; background: var(--ada); color: var(--void); display: flex; align-items: center; justify-content: center; font: 600 26px var(--sans); }
      @keyframes upspin { to { transform: rotate(360deg); } }
    </style>

    <main>
      <section class="hero narrow">
        <p class="eyebrow"><span class="mk">&gt;&#8201;&lt;</span> upgrade</p>
        <h1 id="head">Choose your plan</h1>
        <p class="lede" id="sub">Checking your upgrade link…</p>
      </section>

      <section id="panel" hidden>
        <div class="up-wrap">
          <div class="up-toggle" id="toggle" hidden>
            <div class="pill">
              <button id="t-monthly" class="on" type="button">Monthly</button>
              <button id="t-yearly" type="button">Yearly<span class="save" id="save"></span></button>
            </div>
          </div>
          <!-- Plan cards render from the backend's live catalog (GET /v1/billing/plans), managed in
               the Kelviq dashboard — a price change there shows up here without a deploy. -->
          <div class="up-grid" id="plans"></div>
          <div class="up-trust">
            <span>Secure checkout by Kelviq</span>
            <span>Activates instantly</span>
            <span>Cancel any time</span>
          </div>
          <p class="fine up-note" id="note"></p>
        </div>
      </section>

      <section id="statebox" hidden>
        <div class="up-wrap up-state">
          <div id="state-icon"></div>
          <p class="fine" id="state-text"></p>
        </div>
      </section>

      <section class="band" id="problem" hidden>
        <p class="fine" id="problem-text"></p>
        <p><a class="cta-sm" href="pricing.html">See plans</a></p>
      </section>
    </main>

    <script src="theme.js"></script>
    <script>
      // The backend that issued the session. Overridable so a staging site (or a local dev run,
      // via ?api=) can point at a staging API.
      const qs = new URLSearchParams(location.search);
      const API = qs.get('api') || window.ADA_API || 'https://ada-server-1024230698481.asia-south1.run.app/v1';
      const $ = (id) => document.getElementById(id);
      const fmt = (n) => (n >= 1e6 ? (n / 1e6).toFixed(n >= 1e7 ? 0 : 1) + 'M' : Math.round(n / 1e3) + 'k');
      const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

      function fail(msg) {
        $('sub').textContent = '';
        $('head').textContent = 'This link isn’t valid';
        $('problem-text').textContent = msg;
        $('problem').hidden = false;
      }

      async function getJson(path, init) {
        const r = await fetch(`${API}${path}`, init);
        const data = await r.json().catch(() => null);
        return { r, data };
      }

      let period = 'MONTHLY';
      let cat = null, sess = null, sid = '';

      function showState(kind, text) {
        $('panel').hidden = true;
        $('statebox').hidden = false;
        $('state-icon').innerHTML = kind === 'spin' ? '<div class="up-spin"></div>' : '<div class="up-check">✓</div>';
        $('state-text').textContent = text;
      }

      // After payment Kelviq sends the buyer back here with &paid=1. The plan is granted by the
      // payment webhook, not by this page — so poll the session briefly until the grant lands.
      async function confirmPaid(id) {
        $('head').textContent = 'Payment received';
        $('sub').textContent = '';
        showState('spin', 'Activating your plan…');
        for (let i = 0; i < 20; i++) {
          const { r, data } = await getJson(`/billing/checkout/${encodeURIComponent(id)}`).catch(() => ({}));
          if (r && r.ok && data.status === 'paid') {
            $('head').textContent = 'You’re upgraded';
            showState('check', `Your account is on ${data.label}. Close this tab and head back to Ada — the new plan applies to your next request.`);
            return;
          }
          await new Promise((res) => setTimeout(res, 2500));
        }
        showState('spin', 'Payment received. Activation is taking a moment — your plan will be live shortly. You can safely close this tab.');
      }

      function priceHtml(p) {
        const m = p.prices && p.prices.MONTHLY;
        const y = p.prices && p.prices.YEARLY;
        if (p.plan === 'free') return { big: `<b>${esc(cat.symbol)}0</b><span>/month</span>`, cycle: 'free forever' };
        if (period === 'YEARLY' && y != null) {
          const pm = y / 12;
          return {
            big: `<b>${esc(cat.symbol)}${esc(Number.isInteger(pm) ? pm : pm.toFixed(2))}</b><span>/month</span>`,
            cycle: `billed yearly — ${cat.symbol}${y}/year`,
          };
        }
        if (m != null) return { big: `<b>${esc(cat.symbol)}${esc(m)}</b><span>/month</span>`, cycle: 'billed monthly' };
        return { big: '<b>Custom</b>', cycle: 'talk to us' };
      }

      function renderPlans() {
        $('plans').innerHTML = cat.plans
          .map((p) => {
            const free = p.plan === 'free';
            const hot = !free && (p.plan === sess.plan || cat.plans.filter((x) => x.plan !== 'free').length === 1);
            const { big, cycle } = priceHtml(p);
            const badge = hot ? '<span class="up-badge">Recommended</span>' : free ? '<span class="up-badge mute">Current plan</span>' : '';
            const feats = [
              p.models === 'all' ? 'Every model in the catalogue' : 'Free models only',
              `${fmt(p.monthlyTokens)} tokens / month`,
              free ? 'Community support' : 'Priority support',
            ];
            const cta = free
              ? '<button class="up-cta ghost" disabled>Your current plan</button>'
              : `<button class="up-cta ${hot ? 'primary' : 'ghost'}" data-plan="${esc(p.kelviqPlan || p.plan)}">Upgrade to ${esc(p.label)}</button>`;
            return `<article class="up-card${hot ? ' hot' : ''}">${badge}
              <h2 class="up-name">${esc(p.label)}</h2>
              <div class="up-price">${big}</div>
              <p class="up-cycle">${esc(cycle)}</p>
              <ul class="up-feats">${feats.map((f) => `<li>${esc(f)}</li>`).join('')}</ul>
              ${cta}
            </article>`;
          })
          .join('');
        for (const btn of $('plans').querySelectorAll('button[data-plan]')) {
          btn.onclick = async () => {
            btn.disabled = true;
            btn.textContent = 'Opening secure checkout…';
            const { r, data } = await getJson(`/billing/checkout/${encodeURIComponent(sid)}/purchase`, {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({ plan: btn.dataset.plan, chargePeriod: period }),
            }).catch(() => ({}));
            if (r && r.ok && data.url) {
              location.href = data.url; // → the payment provider's hosted checkout
            } else {
              $('note').textContent = (data && data.error && data.error.message) || 'Could not start payment — try again.';
              btn.disabled = false;
              btn.textContent = 'Upgrade';
            }
          };
        }
        $('panel').hidden = false;
      }

      function wireToggle() {
        const paid = cat.plans.filter((p) => p.plan !== 'free');
        const hasYearly = paid.some((p) => p.prices && p.prices.YEARLY != null);
        $('toggle').hidden = !hasYearly;
        if (!hasYearly) return;
        const ref = paid.find((p) => p.prices && p.prices.MONTHLY > 0 && p.prices.YEARLY > 0);
        if (ref) $('save').textContent = ` −${Math.round((1 - ref.prices.YEARLY / (ref.prices.MONTHLY * 12)) * 100)}%`;
        const set = (p) => {
          period = p;
          $('t-monthly').classList.toggle('on', p === 'MONTHLY');
          $('t-yearly').classList.toggle('on', p === 'YEARLY');
          renderPlans();
        };
        $('t-monthly').onclick = () => set('MONTHLY');
        $('t-yearly').onclick = () => set('YEARLY');
      }

      (async () => {
        const id = qs.get('s');
        if (!id) return fail('No upgrade session in this link. Start the upgrade from inside Ada.');
        sid = id;
        let r, data;
        try {
          ({ r, data } = await getJson(`/billing/checkout/${encodeURIComponent(id)}`));
        } catch {
          return fail('Could not reach the Ada backend. Check your connection and try again.');
        }
        if (!r.ok) return fail((data && data.error && data.error.message) || 'This upgrade link is unknown or has already been used.');
        if (data.status === 'expired') return fail('This upgrade link has expired. Start a new one from Ada — links last 30 minutes.');
        if (data.status === 'paid') {
          $('head').textContent = 'Already upgraded';
          showState('check', `Your account is on ${data.label}. Close this tab and head back to Ada.`);
          return;
        }
        if (qs.get('paid')) return confirmPaid(id);

        // Pending: show the live plan catalog and let the buyer choose.
        sess = data;
        const plansRes = await getJson('/billing/plans').catch(() => ({}));
        if (!plansRes.r || !plansRes.r.ok) return fail('Could not load plans. Try again in a moment.');
        cat = plansRes.data;
        $('sub').textContent = 'Live pricing — pick a plan and pay on Kelviq’s secure checkout.';
        wireToggle();
        renderPlans();
        if (cat.source !== 'kelviq') $('note').textContent = 'Payment isn’t connected on this server yet — plans shown for reference.';
      })();
    </script>
  </body>
</html>
