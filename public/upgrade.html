<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- An upgrade link is private and single-use. Keeping it out of search results costs one line
         and stops a shared screenshot from becoming an indexed page. -->
    <meta name="robots" content="noindex, nofollow" />
    <!-- No Referer at all: the session id is in the query string, and a referrer header would hand
         it to every third party this page ever loads from. -->
    <meta name="referrer" content="no-referrer" />
    <title>Upgrade — Ada</title>
    <link rel="icon" href="assets/img/icon.png" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="bar">
      <a class="brand" href="index.html">
        <img src="assets/img/mark.svg" alt="" width="22" height="22" />
        <span>Ada</span>
      </a>
      <nav>
        <a href="index.html#product">Product</a>
        <a href="pricing.html">Pricing</a>
        <button id="theme" class="tgl" type="button" title="Switch theme" aria-label="Switch theme">
          <svg class="sun" width="14" height="14" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="9" cy="9" r="3.4" />
            <path d="M9 1.5v2M9 14.5v2M1.5 9h2M14.5 9h2M3.7 3.7l1.4 1.4M12.9 12.9l1.4 1.4M14.3 3.7l-1.4 1.4M5.1 12.9l-1.4 1.4" stroke-linecap="round" />
          </svg>
          <svg class="moon" width="14" height="14" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M15 10.8A6.5 6.5 0 0 1 7.2 3a6.5 6.5 0 1 0 7.8 7.8z" stroke-linejoin="round" />
          </svg>
        </button>
      </nav>
    </header>

    <main>
      <section class="hero narrow">
        <p class="eyebrow"><span class="mk">&gt;&#8201;&lt;</span> upgrade</p>
        <h1 id="head">Confirm your upgrade</h1>
        <p class="lede" id="sub">Checking your upgrade link…</p>
      </section>

      <section class="band" id="panel" hidden>
        <!-- Plan cards render from the backend's live catalog (GET /v1/billing/plans), managed in
             the Kelviq dashboard — a price change there shows up here without a deploy. -->
        <div class="cards" id="plans"></div>
        <p class="fine" id="note"></p>
      </section>

      <section class="band" id="problem" hidden>
        <p class="fine" id="problem-text"></p>
        <p><a class="cta-sm" href="pricing.html">See plans</a></p>
      </section>
    </main>

    <script src="theme.js"></script>
    <script>
      // The backend that issued the session. Overridable so a staging site (or a local dev run,
      // via ?api=) can point at a staging API.
      const qs = new URLSearchParams(location.search);
      const API = qs.get('api') || window.ADA_API || 'https://ada-server-1024230698481.asia-south1.run.app/v1';
      const $ = (id) => document.getElementById(id);
      const fmt = (n) => (n >= 1e6 ? (n / 1e6).toFixed(n >= 1e7 ? 0 : 1) + 'M' : Math.round(n / 1e3) + 'k');
      const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

      function fail(msg) {
        $('sub').textContent = '';
        $('head').textContent = 'This link isn’t valid';
        $('problem-text').textContent = msg;
        $('problem').hidden = false;
      }

      async function getJson(path, init) {
        const r = await fetch(`${API}${path}`, init);
        const data = await r.json().catch(() => null);
        return { r, data };
      }

      // After payment Kelviq sends the buyer back here with &paid=1. The plan is granted by the
      // payment webhook, not by this page — so poll the session briefly until the grant lands.
      async function confirmPaid(id) {
        $('sub').textContent = 'Payment received — activating your plan…';
        for (let i = 0; i < 20; i++) {
          const { r, data } = await getJson(`/billing/checkout/${encodeURIComponent(id)}`).catch(() => ({}));
          if (r && r.ok && data.status === 'paid') {
            $('head').textContent = 'You’re upgraded';
            $('sub').textContent = `Your account is on ${data.label}. Close this tab and head back to Ada — the new plan applies to your next request.`;
            return;
          }
          await new Promise((res) => setTimeout(res, 2500));
        }
        $('sub').textContent = 'Payment received. Activation is taking a moment — your plan will be live shortly.';
      }

      function renderPlans(catalog, session, sessionId) {
        const paid = catalog.plans.filter((p) => p.plan !== 'free');
        $('plans').innerHTML = paid
          .map((p) => {
            const monthly = p.prices && p.prices.MONTHLY != null ? p.prices.MONTHLY : null;
            const price = monthly != null ? `<b>${esc(catalog.symbol)}${esc(monthly)}</b><span>/month</span>` : '<b>Custom</b>';
            const current = p.plan === session.plan ? ' — your selection' : '';
            return `<article class="card">
              <h2>${esc(p.label)}${current}</h2>
              <p class="price">${price}</p>
              <ul>
                <li>${p.models === 'all' ? 'Every model in the catalogue' : 'Free models only'}</li>
                <li>${fmt(p.monthlyTokens)} tokens / month</li>
                <li>Cancel any time</li>
              </ul>
              <button class="cta-sm" type="button" data-plan="${esc(p.kelviqPlan || p.plan)}">Continue to payment</button>
            </article>`;
          })
          .join('');
        for (const btn of $('plans').querySelectorAll('button[data-plan]')) {
          btn.onclick = async () => {
            btn.disabled = true;
            btn.textContent = 'Opening payment…';
            const { r, data } = await getJson(`/billing/checkout/${encodeURIComponent(sessionId)}/purchase`, {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({ plan: btn.dataset.plan }),
            }).catch(() => ({}));
            if (r && r.ok && data.url) {
              location.href = data.url; // → the payment provider's hosted checkout
            } else {
              $('note').textContent = (data && data.error && data.error.message) || 'Could not start payment — try again.';
              btn.disabled = false;
              btn.textContent = 'Continue to payment';
            }
          };
        }
        $('panel').hidden = false;
      }

      (async () => {
        const id = qs.get('s');
        if (!id) return fail('No upgrade session in this link. Start the upgrade from inside Ada.');
        let r, data;
        try {
          ({ r, data } = await getJson(`/billing/checkout/${encodeURIComponent(id)}`));
        } catch {
          return fail('Could not reach the Ada backend. Check your connection and try again.');
        }
        if (!r.ok) return fail((data && data.error && data.error.message) || 'This upgrade link is unknown or has already been used.');
        if (data.status === 'expired') return fail('This upgrade link has expired. Start a new one from Ada — links last 30 minutes.');
        if (data.status === 'paid') {
          $('head').textContent = 'Already upgraded';
          $('sub').textContent = `Your account is on ${data.label}. Close this tab and head back to Ada.`;
          return;
        }
        if (qs.get('paid')) return confirmPaid(id);

        // Pending: show the live plan catalog and let the buyer choose.
        const plansRes = await getJson('/billing/plans').catch(() => ({}));
        if (!plansRes.r || !plansRes.r.ok) return fail('Could not load plans. Try again in a moment.');
        $('sub').textContent = 'Pick a plan, then continue to payment.';
        renderPlans(plansRes.data, data, id);
        if (plansRes.data.source !== 'kelviq') $('note').textContent = 'Payment isn’t connected on this server yet — plans shown for reference.';
      })();
    </script>
  </body>
</html>
